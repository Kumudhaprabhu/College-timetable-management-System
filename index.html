

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Timetable Management System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4A90E2,#6A5ACD);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:350px;
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        .login-box h2{
            text-align:center;
            color:#333;
            margin-bottom:20px;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            padding:10px;
            background:#4A90E2;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#357ABD;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            text-decoration:none;
            color:#4A90E2;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2 >TimeFlow</h2>

    <form>
        <label>User Role</label>
        <div class = " role-button"><br>
            <button type = "button" class = "role-btn" onclick="selectRole('student',this)">Student</button><br><br>
            <button type = "button" class = "role-btn" onclick="selectRole('staff',this)">Staff</button>
        </div>
         <br>
        <label>Username</label>
        <input type="text" placeholder="Enter Username" required>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

        <p><a href="#">Forgot Password?</a></p>
    </form>
</div>

</body>
</html>
